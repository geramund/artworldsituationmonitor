name: adjudicate

on:
  schedule:
    # Weekly, not hourly — this is the only place ANTHROPIC_API_KEY is
    # injected, so it's the only place tier-4 LLM adjudication (SPEC.md §8)
    # can spend anything. The cache in registry/resolution-cache.json means
    # cost doesn't really change with frequency (each article is only ever
    # adjudicated once, whenever it's first seen) — weekly just keeps the
    # review queue's ambiguous backlog from growing stale for a month at a
    # time. Runs the same pipeline/crawl.ts as crawl.yml; the only
    # difference is this workflow's env carries the key.
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  # Shares crawl.yml's group — both workflows write the same registry/,
  # snapshots/, and docs/ files and commit+push to main, so they must never
  # run concurrently.
  group: crawl
  cancel-in-progress: false

jobs:
  adjudicate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pipeline dependencies
        run: npm install

      - name: Install app dependencies
        run: npm install
        working-directory: app

      - name: Geocode any un-cached addresses
        run: npx tsx pipeline/geocode.ts

      - name: Run the crawl (with LLM adjudication enabled)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx pipeline/crawl.ts

      - name: Rebuild the published site (docs/) from fresh snapshots
        run: ./scripts/build-pages.sh

      - name: Commit snapshot + registry + site changes
        run: |
          git config user.name "art-world-situation-monitor[bot]"
          git config user.email "actions@github.com"
          git add snapshots/ registry/ docs/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "adjudicate: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
