name: crawl

on:
  schedule:
    # Hourly — matches the outlet RSS cadence (SPEC.md §6). Manual venues are
    # local file reads (no politeness cost), so re-processing all of them
    # every run is fine; only the outlet fetches hit the network on a
    # cadence that matters.
    - cron: "0 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pipeline dependencies
        run: npm install

      - name: Install app dependencies
        run: npm install
        working-directory: app

      - name: Geocode any un-cached addresses
        run: npx tsx pipeline/geocode.ts

      - name: Run the crawl
        # ANTHROPIC_API_KEY enables tier-4 LLM adjudication. Cost is
        # bounded two ways rather than by cadence: registry/resolution-
        # cache.json means a given article is only ever sent to the model
        # once, ever, and pipeline/resolve.ts caps every single run to at
        # most 25 newly-adjudicated articles regardless of how large the
        # backlog gets — a burst of new candidates just spreads across a
        # few more hourly runs instead of one big bill.
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: npx tsx pipeline/crawl.ts

      - name: Rebuild the published site (docs/) from fresh snapshots
        run: ./scripts/build-pages.sh

      - name: Commit snapshot + registry + site changes
        run: |
          git config user.name "art-world-situation-monitor[bot]"
          git config user.email "actions@github.com"
          git add snapshots/ registry/ docs/
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "crawl: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
